<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050C18">
  <title>SalaIncs · Centro de Control IoT</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
/* ═══════════════════════════════════════════
   SalaIncs · IoT Ferroviario
   variables.css — Design tokens & resets
═══════════════════════════════════════════ */

:root {
  --orange:  #F97316;
  --orange2: #EA6A0C;
  --orange-light: #FFB060;
  --blue:    #1A4A8A;
  --accent:  #4DAAFF;
  --accent2: #6ECCFF;
  --green:   #00CC66;
  --red:     #FF4444;
  --bg:      #050C18;
  --bg2:     #060E1A;
  --bg3:     #0D1625;
  --card:    #0A1420;
  --border:  rgba(30,48,80,.8);
  --text:    #FFFFFF;
  --muted:   rgba(200,220,255,0.65);
  --font-head: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --font-body: 'Barlow', 'Arial', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-head);
  -webkit-font-smoothing: antialiased;
}

/* ── Typography ─────────────────────────── */
h1, h2, h3 {
  font-family: var(--font-head);
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: -0.5px;
  color: var(--text);
  text-shadow: 0 2px 8px rgba(0,0,0,.7);
}

p, .body-text {
  font-family: var(--font-body);
  color: rgba(220,235,255,.92);
  line-height: 1.75;
  text-shadow: 0 1px 4px rgba(0,0,0,.6);
}

/* ── Utility ─────────────────────────────── */
.orange  { color: var(--orange-light); }
.accent  { color: var(--accent); }
.muted   { color: var(--muted); }
.green   { color: var(--green); }
.red     { color: var(--red); }

/* ═══════════════════════════════════════════
   SalaIncs · IoT Ferroviario
   dashboard.css — Control center styles
═══════════════════════════════════════════ */


/* ── Layout ────────────────────────────── */
html, body {
  height: 100%;
  overflow: hidden;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* ── Top bar ────────────────────────────── */
#topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  background: rgba(4,10,22,.95);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 10;
}
.tb-logo {display:flex;align-items:center;gap:10px; display: flex; align-items: center; gap: 10px; }
.tb-logo img { height: 32px; width: 32px; object-fit: contain; }
.tb-name {
  font-size: 18px; font-weight: 900;
  letter-spacing: 3px; color: #fff;
}
.tb-name em { color: var(--orange); font-style: normal; }
.tb-right { display: flex; align-items: center; gap: 20px; }
.tb-status {
  font-size: 14px; font-weight: 700;
  letter-spacing: 1px; color: var(--green);
}
#clock {
  font-size: 28px; font-weight: 900;
  letter-spacing: 2px; color: var(--text);
  min-width: 90px; text-align: right;
}

/* ── Line tabs ──────────────────────────── */
#line-tabs {
  display: flex;
  gap: 8px;
  padding: 10px 24px;
  background: rgba(6,14,26,.9);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  overflow-x: auto;
}
.line-tab {
  font-family: var(--font-head);
  font-size: 22px; font-weight: 900;
  letter-spacing: 2px;
  padding: 8px 22px;
  border: 1px solid rgba(30,50,80,.8);
  border-radius: 3px;
  cursor: pointer;
  transition: all .2s;
  user-select: none;
  flex-shrink: 0;
}
.line-tab:hover { filter: brightness(1.2); }
.line-tab.active { color: #fff !important; box-shadow: 0 0 16px currentColor; }

/* ── Main grid ──────────────────────────── */
#main {
  display: grid;
  grid-template-columns: 1fr 380px;
  grid-template-rows: 1fr auto;
  flex: 1;
  gap: 0;
  overflow: hidden;
}

/* ── Map panel ──────────────────────────── */
#map-panel {
  position: relative;
  background: rgba(6,14,26,.92);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#map-label {
  padding: 10px 16px 6px;
  font-size: 12px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--accent);
  border-bottom: 2px solid var(--accent);
  flex-shrink: 0;
}
#map-canvas {
  flex: 1;
  display: block;
  width: 100%;
}

/* ── Metrics bar ────────────────────────── */
#metrics-bar {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  border-top: 1px solid var(--border);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.metric {
  padding: 12px 10px;
  text-align: center;
  border-right: 1px solid var(--border);
  border-top: 2px solid var(--border);
  background: rgba(6,14,26,.92);
  transition: border-color .3s;
}
.metric:last-child { border-right: none; }
.metric-label {
  font-size: 11px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--muted); margin-bottom: 4px;
}
.metric-value {
  font-size: 34px; font-weight: 900;
  line-height: 1;
}
.metric-unit { font-size: 12px; color: var(--muted); margin-left: 2px; }

/* ── Right panel ────────────────────────── */
#right-panel {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-bottom: 1px solid var(--border);
}

/* Shared panel section */
.panel-section {
  background: rgba(6,14,26,.92);
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel-section:last-child { border-bottom: none; flex: 1; }

.panel-title {
  padding: 10px 16px 8px;
  font-size: 14px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.panel-body {
  padding: 10px 12px;
  overflow-y: auto;
  flex: 1;
}

/* ── Train list ─────────────────────────── */
.train-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  background: rgba(13,22,37,.8);
  border: 1px solid rgba(30,48,80,.6);
  border-left: 3px solid transparent;
  margin-bottom: 6px;
  cursor: pointer;
  transition: all .2s;
  border-radius: 2px;
}
.train-card:hover { border-color: var(--orange); background: rgba(249,115,22,.06); }
.train-card.selected { border-left-color: var(--orange); background: rgba(249,115,22,.08); }
.train-badge {
  width: 40px; height: 40px;
  border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 900; color: #fff;
  flex-shrink: 0;
}
.train-info { flex: 1; min-width: 0; }
.train-station {
  font-size: 15px; font-weight: 700;
  color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 4px;
}
.train-speed-row { display: flex; align-items: center; gap: 8px; }
.train-speed {
  font-size: 22px; font-weight: 900;
  font-family: var(--font-head);
}
.speed-bar {
  flex: 1; height: 5px;
  background: rgba(30,48,80,.8);
  border-radius: 3px; overflow: hidden;
}
.speed-fill { height: 100%; border-radius: 3px; transition: width .6s; }
.train-dir { font-size: 14px; color: var(--muted); flex-shrink: 0; }

/* ── Env sensors ────────────────────────── */
.env-card {
  background: rgba(13,22,37,.8);
  border: 1px solid rgba(30,48,80,.6);
  border-left: 3px solid var(--accent);
  padding: 10px 12px;
  margin-bottom: 6px;
  border-radius: 2px;
}
.env-name {
  font-size: 11px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase;
  color: var(--muted); margin-bottom: 6px;
}
.env-values { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.env-chip {
  font-size: 20px; font-weight: 700;
  font-family: var(--font-head);
}
.env-chip span { font-size: 11px; color: var(--muted); margin-left: 2px; }
.env-bar { height: 4px; background: rgba(30,48,80,.8); border-radius: 2px; overflow: hidden; margin-top: 6px; }
.env-bar-fill { height: 100%; border-radius: 2px; transition: width 1s, background 1s; }

/* ── Event log ──────────────────────────── */
.event-row {
  font-size: 13px;
  padding: 5px 8px;
  border-left: 2px solid;
  margin-bottom: 4px;
  line-height: 1.4;
  border-radius: 0 2px 2px 0;
  animation: fadeIn .3s ease;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }
.event-type { font-weight: 700; margin-right: 4px; }
.event-time { color: rgba(200,220,255,.45); margin-right: 4px; font-size: 11px; }
.event-msg { color: rgba(240,244,250,.88); }

/* ═══════════════════════════════════════════
   MOBILE — full responsive redesign
═══════════════════════════════════════════ */
@media (max-width: 860px) {
  html, body { overflow-y: auto; overflow-x: hidden; height: auto; }

  #app {
    height: auto;
    min-height: 100vh;
    overflow: visible;
  }

  /* Topbar compact */
  #topbar { padding: 10px 14px; }
  .tb-name { font-size: 15px; }
  #clock { font-size: 22px; min-width: 70px; }
  .tb-status { font-size: 12px; }

  /* Line tabs scroll */
  #line-tabs { padding: 8px 12px; gap: 6px; }
  .line-tab { font-size: 18px; padding: 6px 14px; }

  /* Main: single column, natural height */
  #main {
    display: flex;
    flex-direction: column;
    height: auto;
    overflow: visible;
  }

  /* MAP — hidden by default, shown via button */
  #map-panel { display: none; }
  #map-panel.mob-visible {
    display: flex;
    height: 60vw;
    min-height: 200px;
    max-height: 320px;
    border-right: none;
  }

  /* Show map button */
  #mob-map-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: rgba(77,170,255,.08);
    border: 1px solid rgba(77,170,255,.3);
    border-left: 3px solid var(--accent);
    color: var(--accent);
    font-family: var(--font-head);
    font-size: 15px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer;
    width: 100%;
    text-align: left;
  }
  #mob-map-btn:active { background: rgba(77,170,255,.15); }

  /* Metrics: 3 cols */
  #metrics-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-right: none;
  }
  .metric { padding: 10px 6px; }
  .metric-value { font-size: 26px; }
  .metric-label { font-size: 9px; }

  /* Right panel: natural flow */
  #right-panel {
    overflow: visible;
    border-bottom: none;
  }
  .panel-section { overflow: visible; }
  .panel-body { overflow: visible; max-height: none; }
  .panel-title { font-size: 14px; }

  /* Trains: horizontal scroll */
  #trains-body {
    display: flex !important;
    flex-direction: row !important;
    overflow-x: auto;
    gap: 8px;
    padding: 10px 10px 14px;
  }
  #trains-body .train-card {
    flex-direction: column;
    align-items: center;
    min-width: 100px;
    flex-shrink: 0;
    padding: 10px 8px;
    border-left: none;
    border-top: 3px solid transparent;
    margin-bottom: 0;
  }
  .train-info { width: 100%; text-align: center; }
  .train-station { font-size: 12px; text-align: center; }
  .speed-bar { width: 60px; }

  /* Env: readable */
  .env-chip { font-size: 18px; }
  .env-name { font-size: 11px; }

  /* Events: readable */
  .event-row { font-size: 12px; }
}

@media (max-width: 520px) {
  #clock { font-size: 18px; }
  .line-tab { font-size: 16px; padding: 5px 10px; }
  #metrics-bar { grid-template-columns: repeat(2, 1fr); }
  .metric-value { font-size: 24px; }
}

  
/* ── Home button ── */
.home-btn{
  position:fixed;bottom:18px;right:18px;z-index:80;
  width:44px;height:44px;
  background:rgba(9,15,30,.85);
  border:1px solid rgba(30,48,80,.8);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;text-decoration:none;
  font-size:18px;
  transition:all .2s;
  backdrop-filter:blur(6px);
  opacity:.65;
}
.home-btn:hover{
  background:var(--or,#F97316);
  border-color:var(--or,#F97316);
  opacity:1;
  transform:scale(1.08);
}


/* ── TIME SERIES MODAL ── */
#chart-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 300;
  background: rgba(3,8,18,.92);
  backdrop-filter: blur(8px);
  flex-direction: column;
  padding: 20px;
}
#chart-modal.open { display: flex; }
#chart-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  flex-shrink: 0;
}
#chart-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #fff;
}
#chart-subtitle {
  font-size: 13px;
  color: rgba(200,220,255,.55);
  letter-spacing: 1px;
  margin-top: 3px;
}
#chart-close {
  width: 40px; height: 40px;
  background: rgba(30,48,80,.8);
  border: 1px solid rgba(77,170,255,.3);
  color: #fff;
  font-size: 20px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  border-radius: 4px;
  flex-shrink: 0;
  transition: background .2s;
}
#chart-close:hover { background: var(--red); }
#chart-wrap {
  flex: 1;
  position: relative;
  background: rgba(6,14,26,.95);
  border: 1px solid rgba(30,50,80,.8);
  border-radius: 4px;
  overflow: hidden;
  cursor: crosshair;
}
#chart-canvas { display: block; width: 100%; height: 100%; }
#chart-hint {
  position: absolute;
  bottom: 10px;
  right: 14px;
  font-size: 11px;
  color: rgba(200,220,255,.3);
  letter-spacing: 1px;
  pointer-events: none;
}
#chart-toolbar {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-shrink: 0;
}
.chart-btn {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase;
  padding: 7px 16px;
  background: rgba(30,48,80,.8);
  border: 1px solid rgba(77,170,255,.3);
  color: rgba(200,220,255,.8);
  cursor: pointer;
  border-radius: 3px;
  transition: all .2s;
}
.chart-btn:hover { background: rgba(77,170,255,.2); color: #fff; }
.chart-btn.active { background: var(--accent,#4DAAFF); color: #000; border-color: var(--accent,#4DAAFF); }
#chart-current-val {
  margin-left: auto;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 28px; font-weight: 900;
  color: #fff;
  align-self: center;
}
/* Make env chips and train speeds look clickable */
.env-chip, .train-speed { cursor: pointer; }
.env-chip:hover { opacity: .8; text-decoration: underline dotted; }

</style>
</head>

</div>

  D: ['Hombre en vía · Callao — RESUELTO','CO₂ elevado · Palermo','D3 llegando a Cong.Tucumán'],
  E: ['Fuelle P.elevada · E2 · Jujuy','HR alta · Urquiza','PIS offline · Urquiza — recuperado'],
  H: ['Anomalía rodamiento · H1','Ventilación activada · Hospitales','Sensor CO₂ · Corrientes OK'],
};


// ========== TIME SERIES CHART ==========
(function(){
  const HISTORY_LEN = 480; // 480 samples = 8 hours at 1 per minute
  const history = {}; // key → Float32Array

  // Seed history with realistic data
  function seedHistory(key, base, range, noisy){
    const arr = new Float32Array(HISTORY_LEN);
    let v = base;
    for(let i=0;i<HISTORY_LEN;i++){
      v += (Math.random()-.5)*(noisy?range*0.08:range*0.03);
      v = Math.max(base-range, Math.min(base+range, v));
      arr[i] = v;
    }
    return arr;
  }

  // Pre-seed all env channels
  function getHistory(key, base, range){
    if(!history[key]) history[key] = seedHistory(key, base, range, true);
    return history[key];
  }

  // Push new value into rolling buffer
  function pushValue(key, val){
    const arr = history[key];
    if(!arr) return;
    arr.copyWithin(0,1);
    arr[HISTORY_LEN-1] = val;
  }

  // Hook into env update to record history
  const _origUpdateEnvCard = window._updateEnvCard || null;
  // We'll call pushValue from the env loop — monkey-patch
  const origEnv = window.startEnvLoop;

  // Chart state
  let chartOpen = false;
  let chartKey = null;
  let chartLabel = '';
  let chartUnit = '';
  let chartColor = '#4DAAFF';
  let chartMin = 0, chartMax = 100;
  let viewStart = 0, viewLen = 60; // indices into history
  let isDragging = false, dragStartX = 0, dragViewStart = 0;
  let chartCanvas, chartCtx, chartRAF;
  let tooltipX = -1;

  window.openChart = function(key, label, unit, color, min, max, base, range){
    chartKey   = key;
    chartLabel = label;
    chartUnit  = unit;
    chartColor = color;
    chartMin   = min;
    chartMax   = max;
    if(!history[key]) getHistory(key, base, range);
    viewStart  = Math.max(0, HISTORY_LEN - 60);
    viewLen    = 60;
    chartOpen  = true;
    const modal = document.getElementById('chart-modal');
    modal.classList.add('open');
    document.getElementById('chart-title').textContent    = label;
    document.getElementById('chart-subtitle').textContent = 'Últimas ' + Math.round(viewLen) + ' min · Tiempo real';
    document.querySelectorAll('.chart-btn').forEach(b=>b.classList.remove('active'));
    document.querySelector('.chart-btn').classList.add('active');
    initChartCanvas();
    startChartLoop();
  };

  window.closeChart = function(){
    chartOpen = false;
    document.getElementById('chart-modal').classList.remove('open');
    if(chartRAF) cancelAnimationFrame(chartRAF);
  };

  window.setRange = function(btn, minutes){
    viewLen   = minutes;
    viewStart = Math.max(0, HISTORY_LEN - minutes);
    document.querySelectorAll('.chart-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('chart-subtitle').textContent = 'Últimas '+minutes+' min · Tiempo real';
  };

  function initChartCanvas(){
    chartCanvas = document.getElementById('chart-canvas');
    const wrap  = document.getElementById('chart-wrap');
    chartCanvas.width  = wrap.clientWidth;
    chartCanvas.height = wrap.clientHeight;
    chartCtx    = chartCanvas.getContext('2d');
    bindEvents();
  }

  function bindEvents(){
    const w = document.getElementById('chart-wrap');
    // Remove old listeners by cloning
    const nw = w.cloneNode(true);
    w.parentNode.replaceChild(nw, w);
    nw.id = 'chart-wrap';
    chartCanvas = nw.querySelector('#chart-canvas') || nw.appendChild(Object.assign(document.createElement('canvas'),{id:'chart-canvas'}));
    chartCanvas.style.cssText = 'display:block;width:100%;height:100%';
    const wrap = document.getElementById('chart-wrap');
    wrap.style.cursor = 'crosshair';

    // Wheel zoom
    nw.addEventListener('wheel', e=>{
      e.preventDefault();
      const factor = e.deltaY > 0 ? 1.25 : 0.8;
      const cx = e.offsetX / nw.clientWidth;
      const newLen = Math.min(HISTORY_LEN, Math.max(10, viewLen*factor));
      const pivot  = viewStart + cx*viewLen;
      viewLen   = newLen;
      viewStart = Math.max(0, Math.min(HISTORY_LEN-viewLen, pivot - cx*viewLen));
    }, {passive:false});

    // Drag pan
    nw.addEventListener('mousedown', e=>{ isDragging=true; dragStartX=e.offsetX; dragViewStart=viewStart; nw.style.cursor='grabbing'; });
    window.addEventListener('mousemove', e=>{
      if(!isDragging) return;
      const dx = (dragStartX - e.offsetX) / nw.clientWidth * viewLen;
      viewStart = Math.max(0, Math.min(HISTORY_LEN-viewLen, dragViewStart+dx));
    });
    window.addEventListener('mouseup', ()=>{ isDragging=false; if(nw) nw.style.cursor='crosshair'; });

    // Touch pan
    let touchStartX=0, touchViewStart=0;
    nw.addEventListener('touchstart', e=>{ touchStartX=e.touches[0].clientX; touchViewStart=viewStart; e.preventDefault(); },{passive:false});
    nw.addEventListener('touchmove',  e=>{ 
      const dx=(touchStartX-e.touches[0].clientX)/nw.clientWidth*viewLen;
      viewStart=Math.max(0,Math.min(HISTORY_LEN-viewLen,touchViewStart+dx));
      e.preventDefault();
    },{passive:false});

    // Touch pinch zoom
    let pinchDist0=0;
    nw.addEventListener('touchstart',e=>{ if(e.touches.length===2) pinchDist0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); },{passive:true});
    nw.addEventListener('touchmove',e=>{
      if(e.touches.length===2){
        const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
        const factor=pinchDist0/d;
        viewLen=Math.min(HISTORY_LEN,Math.max(10,viewLen*factor));
        viewStart=Math.max(0,Math.min(HISTORY_LEN-viewLen,viewStart));
        pinchDist0=d;
      }
    },{passive:true});

    // Double-click reset
    nw.addEventListener('dblclick', ()=>{ viewStart=Math.max(0,HISTORY_LEN-60); viewLen=60; });

    // Tooltip
    nw.addEventListener('mousemove', e=>{ tooltipX=e.offsetX; });
    nw.addEventListener('mouseleave', ()=>{ tooltipX=-1; });

    // Resize
    window.addEventListener('resize', ()=>{
      if(!chartOpen) return;
      chartCanvas.width  = nw.clientWidth;
      chartCanvas.height = nw.clientHeight;
    });

    chartCtx = chartCanvas.getContext('2d');
    chartCanvas.width  = nw.clientWidth;
    chartCanvas.height = nw.clientHeight;
  }

  function startChartLoop(){
    if(chartRAF) cancelAnimationFrame(chartRAF);
    function frame(){
      if(!chartOpen){ return; }
      drawChart();
      chartRAF = requestAnimationFrame(frame);
    }
    frame();
  }

  function drawChart(){
    if(!chartCtx||!chartCanvas) return;
    const W = chartCanvas.width, H = chartCanvas.height;
    const arr = history[chartKey];
    if(!arr) return;
    const PAD_L=52, PAD_R=16, PAD_T=20, PAD_B=36;
    const plotW=W-PAD_L-PAD_R, plotH=H-PAD_T-PAD_B;
    const x0=PAD_L, y0=PAD_T;

    // Clear
    chartCtx.clearRect(0,0,W,H);

    // Background
    chartCtx.fillStyle='rgba(6,14,26,1)';
    chartCtx.fillRect(0,0,W,H);

    const start = Math.max(0, Math.round(viewStart));
    const end   = Math.min(HISTORY_LEN, Math.round(viewStart+viewLen));
    const slice = arr.slice(start, end);
    const n     = slice.length;
    if(n < 2) return;

    const dataMin = Math.min(...slice);
    const dataMax = Math.max(...slice);
    const padded  = (dataMax-dataMin)*0.12 || 5;
    const yMin    = Math.max(chartMin, dataMin-padded);
    const yMax    = Math.min(chartMax, dataMax+padded);

    function toX(i){ return x0 + (i/(n-1))*plotW; }
    function toY(v){ return y0+plotH - ((v-yMin)/(yMax-yMin))*plotH; }

    // Grid lines
    const nGridY=5;
    chartCtx.strokeStyle='rgba(30,50,80,.5)';
    chartCtx.lineWidth=0.5;
    chartCtx.fillStyle='rgba(107,138,175,.55)';
    chartCtx.font='11px Barlow Condensed,sans-serif';
    chartCtx.textAlign='right';
    for(let g=0;g<=nGridY;g++){
      const v   = yMin + (yMax-yMin)*g/nGridY;
      const gy  = toY(v);
      chartCtx.beginPath(); chartCtx.moveTo(x0,gy); chartCtx.lineTo(x0+plotW,gy); chartCtx.stroke();
      chartCtx.fillText(v.toFixed(chartUnit==='°C'?1:0)+' '+chartUnit, x0-4, gy+4);
    }

    // Time axis labels
    chartCtx.textAlign='center';
    chartCtx.fillStyle='rgba(107,138,175,.55)';
    const nTickX=6;
    for(let t=0;t<=nTickX;t++){
      const idx   = Math.round(t/nTickX*(n-1));
      const gx    = toX(idx);
      const minsAgo = Math.round((HISTORY_LEN-1-(start+idx)));
      const label = minsAgo===0 ? 'ahora' : '-'+minsAgo+'m';
      chartCtx.fillText(label, gx, y0+plotH+22);
      chartCtx.strokeStyle='rgba(30,50,80,.3)';
      chartCtx.lineWidth=0.5;
      chartCtx.beginPath(); chartCtx.moveTo(gx,y0); chartCtx.lineTo(gx,y0+plotH); chartCtx.stroke();
    }

    // Warning threshold line
    let threshold = null;
    if(chartUnit==='ppm') threshold=900;
    if(threshold&&threshold>=yMin&&threshold<=yMax){
      const ty=toY(threshold);
      chartCtx.strokeStyle='rgba(249,115,22,.5)';
      chartCtx.lineWidth=1.5;
      chartCtx.setLineDash([6,4]);
      chartCtx.beginPath(); chartCtx.moveTo(x0,ty); chartCtx.lineTo(x0+plotW,ty); chartCtx.stroke();
      chartCtx.setLineDash([]);
      chartCtx.fillStyle='rgba(249,115,22,.6)';
      chartCtx.textAlign='left';
      chartCtx.fillText('Límite '+threshold+' '+chartUnit, x0+4, ty-4);
    }

    // Area fill
    const aGrad=chartCtx.createLinearGradient(0,y0,0,y0+plotH);
    aGrad.addColorStop(0, chartColor+'35');
    aGrad.addColorStop(1, chartColor+'05');
    chartCtx.beginPath();
    chartCtx.moveTo(toX(0), y0+plotH);
    for(let i=0;i<n;i++) chartCtx.lineTo(toX(i), toY(slice[i]));
    chartCtx.lineTo(toX(n-1), y0+plotH);
    chartCtx.closePath();
    chartCtx.fillStyle=aGrad;
    chartCtx.fill();

    // Line
    chartCtx.beginPath();
    chartCtx.strokeStyle=chartColor;
    chartCtx.lineWidth=2.5;
    chartCtx.lineJoin='round';
    for(let i=0;i<n;i++){
      i===0?chartCtx.moveTo(toX(i),toY(slice[i])):chartCtx.lineTo(toX(i),toY(slice[i]));
    }
    chartCtx.stroke();

    // Last value dot
    const lastX=toX(n-1), lastY=toY(slice[n-1]);
    chartCtx.beginPath(); chartCtx.arc(lastX,lastY,5,0,Math.PI*2);
    chartCtx.fillStyle=chartColor; chartCtx.fill();
    // Pulse
    const pulse=(Date.now()%1500)/1500;
    chartCtx.beginPath(); chartCtx.arc(lastX,lastY,5+pulse*8,0,Math.PI*2);
    chartCtx.strokeStyle=chartColor+Math.round((1-pulse)*120).toString(16).padStart(2,'0');
    chartCtx.lineWidth=1.5; chartCtx.stroke();

    // Tooltip
    if(tooltipX>=x0 && tooltipX<=x0+plotW){
      const ti=Math.round((tooltipX-x0)/plotW*(n-1));
      const tv=slice[Math.max(0,Math.min(n-1,ti))];
      const tx=toX(ti), ty2=toY(tv);
      // Vertical line
      chartCtx.strokeStyle='rgba(255,255,255,.2)'; chartCtx.lineWidth=1; chartCtx.setLineDash([4,4]);
      chartCtx.beginPath(); chartCtx.moveTo(tx,y0); chartCtx.lineTo(tx,y0+plotH); chartCtx.stroke();
      chartCtx.setLineDash([]);
      // Dot
      chartCtx.beginPath(); chartCtx.arc(tx,ty2,6,0,Math.PI*2);
      chartCtx.fillStyle='#fff'; chartCtx.fill();
      chartCtx.strokeStyle=chartColor; chartCtx.lineWidth=2; chartCtx.stroke();
      // Label
      const label=tv.toFixed(chartUnit==='°C'?1:0)+' '+chartUnit;
      const bx=Math.min(tx+8, W-80), by=Math.max(ty2-28,y0+4);
      chartCtx.fillStyle='rgba(9,16,28,.9)'; chartCtx.strokeStyle=chartColor; chartCtx.lineWidth=1;
      chartCtx.beginPath(); chartCtx.roundRect(bx,by,70,22,3); chartCtx.fill(); chartCtx.stroke();
      chartCtx.fillStyle='#fff'; chartCtx.font='bold 13px Barlow Condensed,sans-serif';
      chartCtx.textAlign='center'; chartCtx.fillText(label,bx+35,by+15);
      // Update current value display
      const cvEl=document.getElementById('chart-current-val');
      if(cvEl) cvEl.textContent=label;
    } else {
      const cv=slice[n-1];
      const cvEl=document.getElementById('chart-current-val');
      if(cvEl){ cvEl.textContent=cv.toFixed(chartUnit==='°C'?1:0)+' '+chartUnit; cvEl.style.color=chartColor; }
    }
  }

  // ── Hook env data to push into history ──────────────────────
  const _origUpdateEnv = window.updateEnvCard;
  window._pushChartValue = pushValue;

  // ── Make env chips clickable ─────────────────────────────────
  // Called after buildEnvList renders the DOM
  const _origBuildEnv = window.buildEnvList;
  window.buildEnvList = function(k){
    _origBuildEnv(k);
    // After render, attach click handlers
    setTimeout(()=>attachEnvClicks(k), 50);
  };

  function attachEnvClicks(k){
    envData[k].forEach((e,i)=>{
      const base={co2:{label:'CO₂',unit:'ppm',col:'#F97316',min:300,max:1500,base:750,range:400},
                  temp:{label:'Temperatura',unit:'°C',col:'#4DAAFF',min:15,max:40,base:24,range:8},
                  hum:{label:'Humedad',unit:'%',col:'#4DAAFF',min:30,max:85,base:60,range:20},
                  iaq:{label:'IAQ',unit:'IAQ',col:'#00CC66',min:0,max:150,base:50,range:40}};
      const mk=(field,cfg,stName)=>{
        const el=document.getElementById(`e${field}-${k}${i}`);
        if(!el) return;
        el.style.cursor='pointer';
        el.onclick=()=>openChart(`${k}_${i}_${field}`,`${cfg.label} · ${stName}`,cfg.unit,cfg.col,cfg.min,cfg.max,cfg.base,cfg.range);
        el.title=`Ver historial de ${cfg.label}`;
      };
      mk('co2',base.co2,e.name);
      mk('tmp',base.temp,e.name);
      mk('hum',base.hum,e.name);
      mk('iaq',base.iaq,e.name);
    });
  }

  // Also attach to train speed clicks
  const _origBuildTrains = window.buildTrainList;
  window.buildTrainList = function(k){
    _origBuildTrains(k);
    setTimeout(()=>attachTrainClicks(k),50);
  };

  function attachTrainClicks(k){
    fleet[k].forEach(f=>{
      const el=document.getElementById('ts-'+f.id);
      if(!el) return;
      el.style.cursor='pointer';
      el.title='Ver historial de velocidad';
      el.onclick=()=>{
        if(!history['spd_'+f.id]) history['spd_'+f.id]=seedHistory('spd_'+f.id,40,20,true);
        openChart('spd_'+f.id,'Velocidad · Formación '+f.id,'km/h',LINES[k].color,0,80,40,20);
      };
    });
  }

  // Push speed values into history every second
  setInterval(()=>{
    if(!selLine) return;
    fleet[selLine]&&fleet[selLine].forEach(f=>{
      const key='spd_'+f.id;
      if(history[key]) pushValue(key, f.speed);
    });
  },1000);

  // Push env values
  setInterval(()=>{
    if(!selLine||!envData[selLine]) return;
    envData[selLine].forEach((e,i)=>{
      pushValue(`${selLine}_${i}_co2`, e.co2);
      pushValue(`${selLine}_${i}_tmp`, e.temp);
      pushValue(`${selLine}_${i}_hum`, e.hum);
      pushValue(`${selLine}_${i}_iaq`, e.iaq);
    });
  },5500);

  // Close on Escape
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeChart(); });

})();

</script>
<script>
/* ═══════════════════════════════════════════
   SalaIncs · IoT Ferroviario
   dashboard/map.js — Canvas map renderer
═══════════════════════════════════════════ */

let mapCanvas, mapCtx;

function initMap() {
  mapCanvas = document.getElementById('map-canvas');
  mapCtx    = mapCanvas.getContext('2d');
  resizeMap();
}

function resizeMap() {
  if (!mapCanvas) return;
  const box = mapCanvas.parentElement.getBoundingClientRect();
  mapCanvas.width  = box.width;
  mapCanvas.height = box.height - 40; // minus label
}

function drawMap(lineKey, fleet) {
  if (!mapCtx || !mapCanvas) return;
  const W = mapCanvas.width, H = mapCanvas.height;
  const L = LINES[lineKey];
  const ests = L.ests;
  const n = ests.length;
  const col = L.color;
  const PAD_L = 30, PAD_R = 30;
  const trackY = H * 0.50;
  const x0 = PAD_L, x1 = W - PAD_R;
  const stGap = (x1 - x0) / (n - 1);

  mapCtx.clearRect(0, 0, W, H);

  // ── Sleepers ────────────────────────────
  for (let i = 0; i < n - 1; i++) {
    const step = Math.max(24, stGap / 3);
    const sx = x0 + i * stGap, ex = x0 + (i + 1) * stGap;
    for (let xx = sx + step / 2; xx < ex; xx += step) {
      mapCtx.fillStyle = col + '1A';
      mapCtx.fillRect(xx - 2, trackY - 10, 4, 20);
    }
  }

  // ── Double rail ──────────────────────────
  [-4, 4].forEach(dy => {
    mapCtx.beginPath();
    const g = mapCtx.createLinearGradient(x0, 0, x1, 0);
    g.addColorStop(0,   col + '22');
    g.addColorStop(0.5, col + 'CC');
    g.addColorStop(1,   col + '22');
    mapCtx.strokeStyle = g;
    mapCtx.lineWidth = 3;
    mapCtx.moveTo(x0, trackY + dy);
    mapCtx.lineTo(x1, trackY + dy);
    mapCtx.stroke();
  });

  // ── Stations ─────────────────────────────
  const FT  = Math.max(12, Math.round(H * 0.048));
  const FTT = Math.max(14, Math.round(H * 0.058));
  const labelGap = Math.max(30, H * 0.10);

  ests.forEach((name, i) => {
    const sx  = x0 + i * stGap;
    const isTerm = i === 0 || i === n - 1;
    const above  = i % 2 === 0;
    const R = isTerm ? 10 : 6;

    // Glow for terminals
    if (isTerm) {
      mapCtx.beginPath();
      mapCtx.arc(sx, trackY, 18, 0, Math.PI * 2);
      mapCtx.fillStyle = col + '18';
      mapCtx.fill();
    }

    // Dot
    mapCtx.beginPath();
    mapCtx.arc(sx, trackY, R, 0, Math.PI * 2);
    mapCtx.fillStyle   = isTerm ? col : '#0D1827';
    mapCtx.strokeStyle = col;
    mapCtx.lineWidth   = isTerm ? 0 : 2.5;
    mapCtx.fill();
    if (!isTerm) mapCtx.stroke();

    // Tick
    const tickEnd = above
      ? trackY - labelGap + FT
      : trackY + labelGap - FT * 0.3;
    mapCtx.strokeStyle = col + '55';
    mapCtx.lineWidth = 1.5;
    mapCtx.beginPath();
    mapCtx.moveTo(sx, trackY + (above ? -R : R));
    mapCtx.lineTo(sx, tickEnd);
    mapCtx.stroke();

    // Label
    const labelY = above
      ? trackY - labelGap
      : trackY + labelGap + FT * 0.5;

    mapCtx.save();
    mapCtx.translate(sx, labelY);
    mapCtx.font = `${isTerm ? 'bold ' : ''}${isTerm ? FTT : FT}px 'Barlow Condensed', Arial Narrow, sans-serif`;
    mapCtx.fillStyle  = isTerm ? col : 'rgba(210,230,255,.75)';
    mapCtx.textAlign  = 'center';
    mapCtx.fillText(name, 0, 0);
    mapCtx.restore();
  });

  // ── Trains ───────────────────────────────
  const TW = Math.max(36, Math.round(W * 0.038));
  const TH = Math.max(20, Math.round(H * 0.08));
  const FTR = Math.max(13, Math.round(H * 0.050));

  (fleet || []).forEach(f => {
    const tx = x0 + f.pos * (x1 - x0);

    // Speed label
    const spdY = trackY + TH * 0.5 + FTR + 10;
    mapCtx.font = `bold ${FTR * 0.9}px 'Barlow Condensed', sans-serif`;
    mapCtx.fillStyle  = col + 'CC';
    mapCtx.textAlign  = 'center';
    mapCtx.fillText(Math.round(f.speed) + ' km/h', tx, spdY);

    // Selected ring
    if (f.selected) {
      const pulse = (Date.now() % 1800) / 1800;
      mapCtx.beginPath();
      mapCtx.arc(tx, trackY, TW * 0.7 + pulse * 12, 0, Math.PI * 2);
      mapCtx.strokeStyle = col + Math.round((1 - pulse) * 100).toString(16).padStart(2, '0');
      mapCtx.lineWidth = 2;
      mapCtx.stroke();
    }

    // Train body
    mapCtx.fillStyle = col;
    mapCtx.beginPath();
    mapCtx.roundRect(tx - TW / 2, trackY - TH / 2, TW, TH, 4);
    mapCtx.fill();

    // Nose
    const noseW = TW * 0.28;
    if (f.dir > 0) {
      mapCtx.beginPath();
      mapCtx.moveTo(tx + TW / 2,        trackY - TH / 2);
      mapCtx.lineTo(tx + TW / 2 + noseW, trackY);
      mapCtx.lineTo(tx + TW / 2,        trackY + TH / 2);
      mapCtx.fillStyle = col; mapCtx.fill();
    } else {
      mapCtx.beginPath();
      mapCtx.moveTo(tx - TW / 2,        trackY - TH / 2);
      mapCtx.lineTo(tx - TW / 2 - noseW, trackY);
      mapCtx.lineTo(tx - TW / 2,        trackY + TH / 2);
      mapCtx.fillStyle = col; mapCtx.fill();
    }

    // Headlight
    const hlX = f.dir > 0 ? tx + TW / 2 + noseW - 4 : tx - TW / 2 - noseW + 4;
    mapCtx.beginPath();
    mapCtx.arc(hlX, trackY, 4, 0, Math.PI * 2);
    mapCtx.fillStyle = '#FFE066';
    mapCtx.fill();

    // ID label
    mapCtx.font     = `bold ${FTR}px 'Barlow Condensed', sans-serif`;
    mapCtx.fillStyle = '#fff';
    mapCtx.textAlign = 'center';
    mapCtx.fillText(f.id, tx, trackY + FTR * 0.36);

    // Dwell indicator
    if (f.dwell > 0) {
      mapCtx.font     = `bold ${FTR * 0.85}px 'Barlow Condensed', sans-serif`;
      mapCtx.fillStyle = '#FFE066';
      mapCtx.fillText('⏱', tx, trackY - TH * 0.5 - 8);
    }
    mapCtx.textAlign = 'left';
  });
}

</script>
<script>
/* ═══════════════════════════════════════════
   SalaIncs · IoT Ferroviario
   dashboard/app.js — Main controller
═══════════════════════════════════════════ */

/* ── State ──────────────────────────────── */
let selLine   = 'D';
let selTrain  = null;
let fleet     = {};      // { lineKey: [{id,pos,dir,speed,dwell,dwellAt}] }
let envData   = {};      // { lineKey: [{name,co2,temp,hum,iaq,trends...}] }
let raf       = null;

/* ── Init ───────────────────────────────── */
function init() {
  buildFleet();
  buildEnvData();
  buildLineTabs();
  initMap();
  selectLine(selLine);
  startClock();
  startEnvLoop();
  startEventLoop();
  requestAnimationFrame(loop);
}

/* ── Fleet ──────────────────────────────── */
function buildFleet() {
  Object.keys(LINES).forEach(k => {
    const n = LINES[k].ests.length;
    fleet[k] = FLEET_INIT[k]
      .filter((_, i) => i < 2 || n > 10)
      .map(cfg => ({
        id: cfg.id, pos: cfg.pos, dir: cfg.dir,
        speed: 25 + Math.random() * 22,
        dwell: 0, dwellAt: -1,
        color: LINES[k].color,
        selected: false,
      }));
  });
}

function updateFleet() {
  const k = selLine;
  const L = LINES[k];
  const n = L.ests.length;
  fleet[k].forEach(f => {
    if (f.dwell > 0) { f.dwell--; return; }
    const step = (f.speed / 3600) * 0.016 / 2;
    f.pos += f.dir * step;
    // Dwell at stations
    const si  = Math.round(f.pos * (n - 1));
    const stp = si / (n - 1);
    if (Math.abs(f.pos - stp) < 0.006 && si !== f.dwellAt) {
      f.dwellAt = si;
      f.dwell   = 70 + Math.floor(Math.random() * 80);
      f.pos     = stp;
      f.speed   = 0;
    } else if (f.dwell === 0) {
      f.speed += (Math.random() - .5) * 0.5;
      f.speed  = Math.max(18, Math.min(68, f.speed));
    }
    if (f.pos >= 0.99) { f.pos = 0.99; f.dir = -1; f.dwellAt = -1; }
    if (f.pos <= 0.01) { f.pos = 0.01; f.dir =  1; f.dwellAt = -1; }
    updateTrainRow(f);
  });
}

function updateTrainRow(f) {
  const spdEl = document.getElementById('ts-' + f.id);
  const barEl = document.getElementById('tb-' + f.id);
  const stEl  = document.getElementById('tst-' + f.id);
  const n     = LINES[selLine].ests.length;
  const si    = Math.min(Math.round(f.pos * (n - 1)), n - 1);
  if (spdEl) spdEl.textContent = (f.dwell > 0 ? 0 : Math.round(f.speed)) + ' km/h';
  if (barEl) barEl.style.width = (f.speed / 80 * 100) + '%';
  if (stEl)  stEl.textContent  = LINES[selLine].ests[si];
}

/* ── Env data ───────────────────────────── */
function buildEnvData() {
  Object.keys(LINES).forEach(k => {
    envData[k] = LINES[k].envStations.map(name => ({
      name, co2: 680 + Math.random() * 450,
      temp: 20 + Math.random() * 12,
      hum: 45 + Math.random() * 28,
      iaq: 30 + Math.floor(Math.random() * 65),
      co2t: 0, tempt: 0, humt: 0, iaqt: 0,
    }));
  });
}

function startEnvLoop() {
  setInterval(() => {
    Object.keys(LINES).forEach(k => {
      envData[k].forEach((e, i) => {
        e.co2t  = e.co2t  * 0.82 + (Math.random() - .5) * 3.5;
        e.co2   = Math.max(500, Math.min(1400, e.co2 + e.co2t));
        e.tempt = e.tempt * 0.88 + (Math.random() - .5) * 0.035;
        e.temp  = Math.max(17, Math.min(36, e.temp + e.tempt));
        e.humt  = e.humt  * 0.86 + (Math.random() - .5) * 0.12;
        e.hum   = Math.max(38, Math.min(78, e.hum + e.humt));
        e.iaqt  = e.iaqt  * 0.84 + (Math.random() - .5) * 0.7;
        e.iaq   = Math.max(15, Math.min(130, e.iaq + e.iaqt));
        if (k === selLine) updateEnvCard(k, i, e);
      });
    });
    updateMetrics();
  }, 5500);
}

function updateEnvCard(k, i, e) {
  const co2El = document.getElementById('eco2-' + k + i);
  const tmpEl = document.getElementById('etmp-' + k + i);
  const humEl = document.getElementById('ehum-' + k + i);
  const iaqEl = document.getElementById('eiaq-' + k + i);
  const barEl = document.getElementById('ebar-' + k + i);
  const over  = e.co2 > 900;
  if (co2El) { co2El.textContent = Math.round(e.co2); co2El.style.color = over ? 'var(--orange)' : 'var(--green)'; }
  if (tmpEl) tmpEl.textContent = e.temp.toFixed(1);
  if (humEl) humEl.textContent = Math.round(e.hum);
  if (iaqEl) { iaqEl.textContent = Math.round(e.iaq); iaqEl.style.color = e.iaq > 70 ? 'var(--orange)' : 'var(--green)'; }
  if (barEl) { barEl.style.width = (e.co2 / 1500 * 100) + '%'; barEl.style.background = over ? 'var(--orange)' : 'var(--accent)'; }
}

/* ── Event log ──────────────────────────── */
function startEventLoop() {
  let li = 0;
  pushEvent(li++ % 6);
  setInterval(() => pushEvent(li++ % 6), 9500);
}

function pushEvent(lineIdx) {
  const k    = Object.keys(LINES)[lineIdx];
  const msgs = ALARMS[k];
  const msg  = msgs[Math.floor(Math.random() * msgs.length)];
  const types = [
    {t:'INFO',c:'var(--accent)'},
    {t:'WARN',c:'var(--orange)'},
    {t:'OK',  c:'var(--green)'},
    {t:'ALRM',c:'var(--red)'},
  ];
  const type = types[Math.floor(Math.random() * types.length)];
  const now  = new Date();
  const ts   = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
  const el   = document.getElementById('event-log');
  if (!el) return;
  const row = document.createElement('div');
  row.className = 'event-row';
  row.style.cssText = `border-color:${type.c};background:${type.c.replace('var(','rgba(').replace(')','')}11)`;
  row.innerHTML = `<span class="event-type" style="color:${type.c}">[${type.t}]</span><span class="event-time">${ts}·L${k}</span><span class="event-msg">${msg}</span>`;
  el.insertBefore(row, el.firstChild);
  while (el.children.length > 8) el.removeChild(el.lastChild);
}

/* ── Clock ──────────────────────────────── */
function startClock() {
  function tick() {
    const el = document.getElementById('clock');
    if (!el) return;
    const n = new Date();
    el.textContent = `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`;
  }
  tick(); setInterval(tick, 1000);
}

/* ── Line tabs ──────────────────────────── */
function buildLineTabs() {
  const el = document.getElementById('line-tabs');
  el.innerHTML = Object.entries(LINES).map(([k, L]) =>
    `<div class="line-tab" id="tab-${k}"
       style="color:${L.color};border-color:${L.color}40;background:${L.color}12"
       onclick="selectLine('${k}')">${k}</div>`
  ).join('');
}

/* ── Select line ────────────────────────── */
function selectLine(k) {
  selLine  = k;
  selTrain = null;
  // Tabs
  Object.keys(LINES).forEach(kk => {
    const t = document.getElementById('tab-' + kk);
    if (!t) return;
    const L = LINES[kk];
    if (kk === k) {
      t.classList.add('active');
      t.style.background   = L.color + '30';
      t.style.borderColor  = L.color;
    } else {
      t.classList.remove('active');
      t.style.background   = L.color + '12';
      t.style.borderColor  = L.color + '40';
    }
  });
  // Map label
  const lbl = document.getElementById('map-label');
  if (lbl) {
    lbl.textContent = `${LINES[k].name} · ${LINES[k].from} ↔ ${LINES[k].to} · ${LINES[k].ests.length} estaciones · Tiempo real`;
    lbl.style.color       = LINES[k].color;
    lbl.style.borderColor = LINES[k].color;
  }
  // Mobile map button
  const mobBtn = document.getElementById('mob-map-btn');
  if (mobBtn) mobBtn.textContent = `🗺 Ver mapa · ${LINES[k].name}`;
  // Rebuild panels
  buildTrainList(k);
  buildEnvList(k);
  buildMetrics(k);
  resizeMap();
}

/* ── Train list ─────────────────────────── */
function buildTrainList(k) {
  const el = document.getElementById('trains-body');
  const L  = LINES[k];
  if (!el) return;
  el.innerHTML = fleet[k].map(f => {
    const n  = L.ests.length;
    const si = Math.min(Math.round(f.pos * (n - 1)), n - 1);
    const st = L.ests[si];
    return `
    <div class="train-card${f.selected ? ' selected' : ''}" id="tc-${f.id}"
         onclick="selectTrain('${f.id}')"
         style="border-left-color:${f.selected ? L.color : 'transparent'}">
      <div class="train-badge" style="background:${L.color}">${f.id}</div>
      <div class="train-info">
        <div class="train-station" id="tst-${f.id}">${st}</div>
        <div class="train-speed-row">
          <span class="train-speed" id="ts-${f.id}" style="color:${L.color}">${Math.round(f.speed)} km/h</span>
          <div class="speed-bar"><div class="speed-fill" id="tb-${f.id}" style="background:${L.color};width:${f.speed/80*100}%"></div></div>
          <span class="train-dir">${f.dir > 0 ? '→' : '←'}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function selectTrain(id) {
  selTrain = id;
  fleet[selLine].forEach(f => {
    f.selected = f.id === id;
    const card = document.getElementById('tc-' + f.id);
    if (card) {
      card.classList.toggle('selected', f.selected);
      card.style.borderLeftColor = f.selected ? LINES[selLine].color : 'transparent';
    }
  });
}

/* ── Env list ───────────────────────────── */
function buildEnvList(k) {
  const el = document.getElementById('env-body');
  if (!el) return;
  el.innerHTML = envData[k].map((e, i) => {
    const over = e.co2 > 900;
    return `
    <div class="env-card" style="border-left-color:${over ? 'var(--orange)' : 'var(--accent)'}">
      <div class="env-name">${e.name}</div>
      <div class="env-values">
        <div class="env-chip" style="color:${over?'var(--orange)':'var(--green)'}" id="eco2-${k}${i}">${Math.round(e.co2)}<span>ppm</span></div>
        <div class="env-chip" style="color:var(--accent)" id="etmp-${k}${i}">${e.temp.toFixed(1)}<span>°C</span></div>
        <div class="env-chip" style="color:var(--accent)" id="ehum-${k}${i}">${Math.round(e.hum)}<span>%</span></div>
        <div class="env-chip" style="color:${e.iaq>70?'var(--orange)':'var(--green)'}" id="eiaq-${k}${i}">${Math.round(e.iaq)}<span>IAQ</span></div>
      </div>
      <div class="env-bar"><div class="env-bar-fill" id="ebar-${k}${i}" style="width:${e.co2/1500*100}%;background:${over?'var(--orange)':'var(--accent)'}"></div></div>
    </div>`;
  }).join('');
}

/* ── Metrics ────────────────────────────── */
function buildMetrics(k) {
  const L = LINES[k];
  const trains = fleet[k];
  const avgSpd = Math.round(trains.reduce((s, t) => s + t.speed, 0) / trains.length);
  const env    = envData[k];
  const avgCo2 = Math.round(env.reduce((s, e) => s + e.co2, 0) / env.length);
  const avgTmp = (env.reduce((s, e) => s + e.temp, 0) / env.length).toFixed(1);
  const items = [
    { label:'Formaciones', value: trains.length,      unit:'',     color: L.color },
    { label:'Vel. Promedio', value: avgSpd,            unit:'km/h', color: L.color },
    { label:'CO₂ Prom.',     value: avgCo2,            unit:'ppm',  color: avgCo2>900?'var(--orange)':'var(--green)' },
    { label:'Temp. Media',   value: avgTmp,            unit:'°C',   color: 'var(--accent)' },
    { label:'Estaciones',    value: L.ests.length,     unit:'',     color: 'var(--accent)' },
    { label:'Módulos OK',    value: '6/6',             unit:'',     color: 'var(--green)' },
  ];
  const el = document.getElementById('metrics-bar');
  if (!el) return;
  el.innerHTML = items.map(m =>
    `<div class="metric" style="border-top-color:${m.color}">
      <div class="metric-label">${m.label}</div>
      <div><span class="metric-value" style="color:${m.color}">${m.value}</span><span class="metric-unit">${m.unit}</span></div>
    </div>`
  ).join('');
}

function updateMetrics() {
  if (document.getElementById('metrics-bar')) buildMetrics(selLine);
}

/* ── Mobile map toggle ──────────────────── */
function toggleMobMap() {
  const panel = document.getElementById('map-panel');
  if (!panel) return;
  const visible = panel.classList.toggle('mob-visible');
  const btn = document.getElementById('mob-map-btn');
  if (btn) btn.textContent = visible
    ? `✕ Cerrar mapa · ${LINES[selLine].name}`
    : `🗺 Ver mapa · ${LINES[selLine].name}`;
  if (visible) { resizeMap(); }
}

/* ── Main loop ──────────────────────────── */
function loop() {
  updateFleet();
  drawMap(selLine, fleet[selLine]);
  requestAnimationFrame(loop);
}

/* ── Start ──────────────────────────────── */
window.addEventListener('load', init);
window.addEventListener('resize', () => resizeMap());

</script>
